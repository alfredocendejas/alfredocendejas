<svg width="860" height="120" viewBox="0 0 860 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="8+ years, 60+ projects, 1M+ users, -50% delivery time">
  <style>
  .in { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .bar { animation: glow 3.2s ease-in-out infinite; }
  @keyframes glow { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  .sweep { animation: sweep 5s linear infinite; }
  @keyframes sweep { from { transform: translateX(-160px); } to { transform: translateX(1020px); } }
  .dot { animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .in, .bar, .sweep, .dot { animation: none !important; }
    .sweep { display: none; }
  }
</style>
  <defs>
    <linearGradient id="shine" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="858" height="118" rx="14"/></clipPath>
  </defs>
  <rect x="1" y="1" width="858" height="118" rx="14" fill="#0d1117" stroke="#21262d"/>
  <g clip-path="url(#clip)"><rect class="sweep" x="0" y="0" width="160" height="120" fill="url(#shine)"/></g>
  <text class="in" style="animation-delay:0.10s" x="127.0" y="62" font-size="34" font-weight="700" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" text-anchor="middle">8+</text>
  <text class="in" style="animation-delay:0.20s" x="127.0" y="88" font-size="10.5" font-weight="700" fill="#6e7681" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" text-anchor="middle" letter-spacing="1.2">YEARS SHIPPING</text>
  <text class="in" style="animation-delay:0.25s" x="329.0" y="62" font-size="34" font-weight="700" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" text-anchor="middle">60+</text>
  <text class="in" style="animation-delay:0.35s" x="329.0" y="88" font-size="10.5" font-weight="700" fill="#6e7681" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" text-anchor="middle" letter-spacing="1.2">PROJECTS DELIVERED</text>
  <rect class="in" style="animation-delay:0.25s" x="228.0" y="34" width="1" height="62" fill="#21262d"/>
  <text class="in" style="animation-delay:0.40s" x="531.0" y="62" font-size="34" font-weight="700" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" text-anchor="middle">1M+</text>
  <text class="in" style="animation-delay:0.50s" x="531.0" y="88" font-size="10.5" font-weight="700" fill="#6e7681" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" text-anchor="middle" letter-spacing="1.2">USERS AT SCALE</text>
  <rect class="in" style="animation-delay:0.40s" x="430.0" y="34" width="1" height="62" fill="#21262d"/>
  <text class="in" style="animation-delay:0.55s" x="733.0" y="62" font-size="34" font-weight="700" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" text-anchor="middle">-50%</text>
  <text class="in" style="animation-delay:0.65s" x="733.0" y="88" font-size="10.5" font-weight="700" fill="#6e7681" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" text-anchor="middle" letter-spacing="1.2">DELIVERY TIME</text>
  <rect class="in" style="animation-delay:0.55s" x="632.0" y="34" width="1" height="62" fill="#21262d"/>

</svg>
