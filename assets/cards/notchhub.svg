<svg width="480" height="160" viewBox="0 0 480 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NotchHub">
  <style>
  .in { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .bar { animation: glow 3.2s ease-in-out infinite; }
  @keyframes glow { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  .sweep { animation: sweep 5s linear infinite; }
  @keyframes sweep { from { transform: translateX(-160px); } to { transform: translateX(640px); } }
  .dot { animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .in, .bar, .sweep, .dot { animation: none !important; }
    .sweep { display: none; }
  }
</style>
  <defs>
    <linearGradient id="shine" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="478" height="158" rx="14"/></clipPath>
  </defs>
  <rect x="1" y="1" width="478" height="158" rx="14" fill="#0d1117" stroke="#21262d"/>
  <g clip-path="url(#clip)"><rect class="sweep" x="0" y="0" width="160" height="160" fill="url(#shine)"/></g>
  <rect class="bar" x="0" y="14" width="4" height="132" rx="2" fill="#58a6ff"/>
  <text class="in" style="animation-delay:0.05s" x="38" y="46" font-size="17" font-weight="700" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" text-anchor="start">NotchHub</text>
  <g class="in" style="animation-delay:.15s"><rect x="397" y="28" width="55" height="22" rx="11" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".5"/><circle class="dot" cx="409" cy="39" r="3" fill="#58a6ff"/><text x="429.5" y="43" font-size="10.5" fill="#58a6ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" text-anchor="middle">Swift</text></g>
  <text class="in" style="animation-delay:0.25s" x="38" y="76" font-size="13.5" font-weight="400" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" text-anchor="start">Turns the macOS notch into a shared dashboard where</text>
  <text class="in" style="animation-delay:0.35s" x="38" y="97" font-size="13.5" font-weight="400" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" text-anchor="start">a family of apps publish live status and quick actions.</text>
  <g class="in" style="animation-delay:0.50s"><rect x="38" y="122" width="58" height="24" rx="12" stroke="#30363d"/><text x="67.0" y="138" font-size="11.5" fill="#adbac7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" text-anchor="middle">macOS</text></g>
  <g class="in" style="animation-delay:0.58s"><rect x="104" y="122" width="72" height="24" rx="12" stroke="#30363d"/><text x="140.0" y="138" font-size="11.5" fill="#adbac7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" text-anchor="middle">SwiftUI</text></g>
  <g class="in" style="animation-delay:0.66s"><rect x="184" y="122" width="65" height="24" rx="12" stroke="#30363d"/><text x="216.5" y="138" font-size="11.5" fill="#adbac7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" text-anchor="middle">AppKit</text></g>
  <g class="in" style="animation-delay:0.74s"><rect x="257" y="122" width="44" height="24" rx="12" stroke="#30363d"/><text x="279.0" y="138" font-size="11.5" fill="#adbac7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" text-anchor="middle">SPM</text></g>

</svg>
