<svg width="480" height="160" viewBox="0 0 480 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Recompensarte">
  <style>
  .in { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .bar { animation: glow 3.2s ease-in-out infinite; }
  @keyframes glow { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  .sweep { animation: sweep 5s linear infinite; }
  @keyframes sweep { from { transform: translateX(-160px); } to { transform: translateX(640px); } }
  .dot { animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .in, .bar, .sweep, .dot { animation: none !important; }
    .sweep { display: none; }
  }
</style>
  <defs>
    <linearGradient id="shine" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="478" height="158" rx="14"/></clipPath>
  </defs>
  <rect x="1" y="1" width="478" height="158" rx="14" fill="#0d1117" stroke="#21262d"/>
  <g clip-path="url(#clip)"><rect class="sweep" x="0" y="0" width="160" height="160" fill="url(#shine)"/></g>
  <rect class="bar" x="0" y="14" width="4" height="132" rx="2" fill="#f78166"/>
  <text class="in" style="animation-delay:0.05s" x="38" y="46" font-size="17" font-weight="700" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" text-anchor="start">Recompensarte</text>
  <g class="in" style="animation-delay:.15s"><rect x="403" y="28" width="49" height="22" rx="11" fill="#f78166" fill-opacity=".12" stroke="#f78166" stroke-opacity=".5"/><circle class="dot" cx="415" cy="39" r="3" fill="#f78166"/><text x="432.5" y="43" font-size="10.5" fill="#f78166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" text-anchor="middle">Live</text></g>
  <text class="in" style="animation-delay:0.25s" x="38" y="76" font-size="13.5" font-weight="400" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" text-anchor="start">Loyalty &amp; rewards platform for local businesses:</text>
  <text class="in" style="animation-delay:0.35s" x="38" y="97" font-size="13.5" font-weight="400" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" text-anchor="start">digital cards, POS, bookings, rallies and wallet passes.</text>
  <g class="in" style="animation-delay:0.50s"><rect x="38" y="122" width="72" height="24" rx="12" stroke="#30363d"/><text x="74.0" y="138" font-size="11.5" fill="#adbac7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" text-anchor="middle">Loyalty</text></g>
  <g class="in" style="animation-delay:0.58s"><rect x="118" y="122" width="44" height="24" rx="12" stroke="#30363d"/><text x="140.0" y="138" font-size="11.5" fill="#adbac7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" text-anchor="middle">POS</text></g>
  <g class="in" style="animation-delay:0.66s"><rect x="170" y="122" width="72" height="24" rx="12" stroke="#30363d"/><text x="206.0" y="138" font-size="11.5" fill="#adbac7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" text-anchor="middle">Next.js</text></g>
  <g class="in" style="animation-delay:0.74s"><rect x="250" y="122" width="79" height="24" rx="12" stroke="#30363d"/><text x="289.5" y="138" font-size="11.5" fill="#adbac7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" text-anchor="middle">Firebase</text></g>

</svg>
