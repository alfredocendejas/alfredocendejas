<svg width="423" height="21" viewBox="0 0 423 21" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Senior Tech Project Manager · Web3 &amp; AI Solutions"><style>
  .in { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .bar { animation: glow 3.2s ease-in-out infinite; }
  @keyframes glow { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  .sweep { animation: sweep 5s linear infinite; }
  @keyframes sweep { from { transform: translateX(-160px); } to { transform: translateX(var(--w)); } }
  .dot { animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .in, .bar, .sweep, .dot { animation: none !important; }
    .sweep { display: none; }
  }
</style>
  <circle class="dot" cx="7" cy="11" r="4" fill="#58a6ff"/>
  <text class="in" x="20" y="14.5" font-size="13.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif"><tspan fill="#e6edf3" font-weight="600">Senior Tech Project Manager</tspan><tspan fill="#8b949e"> · Web3 &amp; AI Solutions</tspan></text>
</svg>
